name: 1Windows App

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions: write-all
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Upload PlayPlus_locallow.exe to Assets
        shell: pwsh
        run: |
          # 创建 assets 目录
          New-Item -ItemType Directory -Path "assets" -Force
          # 将 PlayPlus_locallow.exe 复制到 assets 目录
          # 这里假设 PlayPlus_locallow.exe 已经在仓库根目录
          Copy-Item -Path "PlayPlus_locallow.exe" -Destination "assets\PlayPlus_locallow.exe" -Force

      - name: Set Up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'latest'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Set Up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install Backend Dependencies
        shell: pwsh
        run: |
          cd src-go
          go mod tidy

      - name: Download Geo Files
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb -OutFile src-go/internal/em/geoip.metadb
          Invoke-WebRequest -Uri https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat -OutFile src-go/internal/em/GeoSite.dat
          Invoke-WebRequest -Uri https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb -OutFile src-go/internal/em/GeoLite2-ASN.mmdb

      - name: Get Tag Version
        shell: bash
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Backend for ${{ matrix.arch }}
        shell: pwsh
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ env.VERSION }}
        run: |
          cd src-go
          go build -tags=with_gvisor -trimpath `
            -ldflags "-s -w -X github.com/snakem982/pandora-box/api.Version=$env:VERSION" `
            -o px.exe

      - name: Sync VERSION to package.json
        run: node build/sync-version.js

      - name: Copy PlayPlus_locallow.exe to build directory
        shell: pwsh
        run: |
          # 复制 PlayPlus_locallow.exe 到打包目录
          Copy-Item -Path "assets\PlayPlus_locallow.exe" -Destination "out\PlayPlus_locallow.exe" -Force

      - name: Build Frontend for ${{ matrix.arch }}
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          if ($arch -eq "amd64") {
            $arch = "x64"
          }
          npm dedupe
          npm prune
          npx electron-forge make --arch=$arch

      - name: Add PlayPlus_locallow.exe to final packages
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          if ($arch -eq "amd64") {
            $arch = "x64"
          }
          
          # 复制 PlayPlus_locallow.exe 到所有输出目录
          Copy-Item -Path "assets\PlayPlus_locallow.exe" -Destination "out\Xianyu-Box*\PlayPlus_locallow.exe" -Force
          Copy-Item -Path "assets\PlayPlus_locallow.exe" -Destination "out\make\wix\$arch\PlayPlus_locallow.exe" -Force

      - name: Compress Executables
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          if ($arch -eq "amd64") {
            $arch = "x64"
          }
          Compress-Archive -Path out\Xianyu-Box*\* -DestinationPath "windows-${{ matrix.arch }}-app.zip"
          Compress-Archive -Path out\make\wix\$arch\* -DestinationPath "windows-${{ matrix.arch }}-msi.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          draft: false
          prerelease: true
          files: |
            windows-${{ matrix.arch }}-app.zip
            windows-${{ matrix.arch }}-msi.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
